# Redireciona HTTP para HTTPS
server {
    listen 80;
    server_name bidtoys.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bidtoys.com.br;

    ssl_certificate /etc/letsencrypt/live/bidtoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidtoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Usa o DNS interno do Docker para resolver nomes de containers dinamicamente.
    # Isso evita o bug de nginx cachear o IP de um container e falhar após reinicializações.
    resolver 127.0.0.11 valid=10s;

    # Frontend (React SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        set $backend_upstream http://backend:8080;
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # WebSocket (leilão ao vivo)
    location /ws/ {
        set $backend_upstream http://backend:8080;
        rewrite ^/ws/(.*) /ws/$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Imagens do MinIO — rewrite remove o prefixo /storage/ antes do proxy_pass
    location /storage/ {
        set $minio_upstream http://minio:9000;
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
