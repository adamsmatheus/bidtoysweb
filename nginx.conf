# HTTP: serve index.html na raiz (para verificação de domínio do Meta), redireciona o resto para HTTPS
server {
    listen 80;
    server_name bidtoys.com.br www.bidtoys.com.br;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /200td7oy433m77lbnn2744ckew0cpw.html {
        root /usr/share/nginx/html;
        try_files /200td7oy433m77lbnn2744ckew0cpw.html =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bidtoys.com.br www.bidtoys.com.br;

    ssl_certificate /etc/letsencrypt/live/bidtoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidtoys.com.br/privkey.pem;

    # Frontend (React SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # WebSocket (leilão ao vivo)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Imagens do MinIO
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
